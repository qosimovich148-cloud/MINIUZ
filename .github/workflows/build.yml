name: Build MINI UZ

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 9.6.0
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.6-bin.zip
          unzip -q gradle-9.6-bin.zip -d "$HOME"
          echo "$HOME/gradle-9.6/bin" >> "$GITHUB_PATH"

      - name: Build AAB
        run: gradle bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: MINI-UZ-AAB
          path: app/build/outputs/bundle/release/*.aab
